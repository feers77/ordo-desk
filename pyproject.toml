[project]
name = "ordo-desk"
version = "0.1.0"
description = "Interfaces humanas —web y Telegram— sobre la API de ORDO"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "anyio>=4",
    "mypy>=1.14",
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "ruff>=0.16",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["bff/src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "PTH", "RUF", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "DTZ", "T20"]
"sim/**" = ["T20"]
"tools/**" = ["T20"]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["bff/src/ordo_desk"]
mypy_path = "bff/src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["bff/src"]
